<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT Nagpur | Student Information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="form-card" aria-labelledby="page-title">
            <p class="eyebrow">SIT NAGPUR</p>
            <h1 id="page-title">Student Information Form</h1>
            <p class="intro">Please fill in your details to continue.</p>

            <form id="student-form">
                <div class="form-grid">
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="field">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="120" required>
                    </div>
                    <div class="field">
                        <label for="number">Phone Number</label>
                        <input type="tel" id="number" name="number" placeholder="Enter your phone number" required>
                    </div>
                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="field full-width">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" placeholder="Enter your address" rows="3" required></textarea>
                    </div>
                </div>
                <button type="submit">Submit Details <span aria-hidden="true">→</span></button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
