<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT Nagpur | Student Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="details-card" aria-labelledby="details-title">
            <div class="success-mark" aria-hidden="true">✓</div>
            <p class="eyebrow">SIT NAGPUR</p>
            <h1 id="details-title">Submission received</h1>
            <p class="intro">Your student information has been saved successfully.</p>
            <button id="show-details" type="button" onclick="showDetails()">Show Details</button>
            <div id="details-list" class="details-list" aria-live="polite"></div>
            <a class="back-link" href="index.html">Edit Details</a>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
