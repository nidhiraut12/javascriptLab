<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Marks | Student Grading System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="page-header">
            <div>
                <p class="eyebrow">Student portal</p>
                <h1>Upload Marks</h1>
            </div>
            <button type="button" class="logout-button" id="logoutButton">Logout</button>
        </div>
        <p class="intro">Enter marks for each subject to calculate the final result.</p>

        <form id="gradeForm">
            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter name" required>

            <label for="sub1">Subject 1 Marks</label>
            <input type="number" id="sub1" placeholder="0-100" min="0" max="100" required>

            <label for="sub2">Subject 2 Marks</label>
            <input type="number" id="sub2" placeholder="0-100" min="0" max="100" required>

            <label for="sub3">Subject 3 Marks</label>
            <input type="number" id="sub3" placeholder="0-100" min="0" max="100" required>

            <label for="sub4">Subject 4 Marks</label>
            <input type="number" id="sub4" placeholder="0-100" min="0" max="100" required>

            <label for="sub5">Subject 5 Marks</label>
            <input type="number" id="sub5" placeholder="0-100" min="0" max="100" required>

            <button type="submit">Calculate Result</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
